<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificador de imágenes - Teachable Machine</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#e2e8f0; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; align-items:center; padding:24px 12px; }
  h1 { margin:0 0 6px; font-size:1.7rem; text-align:center; }
  p.sub { margin:0 0 20px; color:#94a3b8; text-align:center; }
  .card { background:var(--card); border-radius:14px; padding:18px; width:100%; max-width:520px; margin-bottom:16px; text-align:center; }
  button, label.btn { background:var(--acc); color:#0f172a; border:0; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer; margin:4px; display:inline-block; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #media { margin:14px auto; min-height:200px; display:flex; justify-content:center; align-items:center; }
  #media canvas, #media img { max-width:100%; border-radius:10px; }
  .row { display:flex; align-items:center; gap:10px; margin:8px 0; text-align:left; }
  .row .name { width:38%; font-size:.95rem; }
  .bar { flex:1; background:#334155; border-radius:6px; height:18px; overflow:hidden; }
  .fill { height:100%; width:0; background:var(--acc); transition:width .15s; }
  .pct { width:52px; text-align:right; font-variant-numeric:tabular-nums; font-size:.9rem; }
  #top { font-size:1.3rem; font-weight:700; margin-top:10px; color:var(--acc); }
  #status { color:#94a3b8; font-size:.9rem; }
</style>
</head>
<body>
  <h1>Clasificador de imágenes</h1>
  <p class="sub">Modelo entrenado con Teachable Machine</p>

  <div class="card">
    <button id="btnCam" onclick="startCam()">📷 Usar cámara</button>
    <button id="btnStop" onclick="stopCam()" disabled>⏹ Detener</button>
    <label class="btn">🖼 Subir imagen
      <input type="file" id="file" accept="image/*" hidden>
    </label>
    <div id="status">Cargando modelo...</div>
    <div id="media"></div>
    <div id="top"></div>
  </div>

  <div class="card" id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // 👇 PEGA AQUÍ LA URL DE TU MODELO (debe terminar en /)
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/XXXXXXXXX/";

  let model, webcam, maxPredictions, running = false;
  const media = document.getElementById("media");
  const results = document.getElementById("results");
  const statusEl = document.getElementById("status");
  const topEl = document.getElementById("top");

  async function loadModel() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      maxPredictions = model.getTotalClasses();
      results.innerHTML = "";
      for (let i = 0; i < maxPredictions; i++) {
        results.insertAdjacentHTML("beforeend",
          `<div class="row"><span class="name" id="n${i}"></span><div class="bar"><div class="fill" id="f${i}"></div></div><span class="pct" id="p${i}">0%</span></div>`);
      }
      statusEl.textContent = "Modelo listo ✅ Usa la cámara o sube una imagen.";
    } catch (e) {
      statusEl.textContent = "❌ No se pudo cargar el modelo. Revisa MODEL_URL.";
      console.error(e);
    }
  }

  function show(prediction) {
    let best = prediction[0];
    prediction.forEach((p, i) => {
      document.getElementById("n" + i).textContent = p.className;
      document.getElementById("f" + i).style.width = (p.probability * 100).toFixed(0) + "%";
      document.getElementById("p" + i).textContent = (p.probability * 100).toFixed(1) + "%";
      if (p.probability > best.probability) best = p;
    });
    topEl.textContent = "Resultado: " + best.className;
  }

  async function startCam() {
    if (!model) return;
    stopCam();
    webcam = new tmImage.Webcam(300, 300, true);
    await webcam.setup();
    await webcam.play();
    media.innerHTML = "";
    media.appendChild(webcam.canvas);
    running = true;
    document.getElementById("btnStop").disabled = false;
    window.requestAnimationFrame(loop);
  }

  async function loop() {
    if (!running) return;
    webcam.update();
    show(await model.predict(webcam.canvas));
    window.requestAnimationFrame(loop);
  }

  function stopCam() {
    running = false;
    if (webcam) { webcam.stop(); webcam = null; }
    document.getElementById("btnStop").disabled = true;
  }

  document.getElementById("file").addEventListener("change", (ev) => {
    const f = ev.target.files[0];
    if (!f || !model) return;
    stopCam();
    const img = new Image();
    img.onload = async () => {
      media.innerHTML = "";
      media.appendChild(img);
      show(await model.predict(img));
    };
    img.src = URL.createObjectURL(f);
  });

  loadModel();
</script>
</body>
</html>
